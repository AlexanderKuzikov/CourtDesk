<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CourtDesk — Поиск дел</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
    header { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border-bottom: 2px solid #334155; padding: 14px 24px; display: flex; align-items: center; gap: 14px; }
    header h1 { font-size: 20px; font-weight: 700; }
    header h1 span { background: linear-gradient(90deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    header nav { margin-left: auto; display: flex; gap: 10px; }
    header nav a { color: #94a3b8; text-decoration: none; font-size: 13px; padding: 4px 10px; border-radius: 6px; }
    header nav a:hover { background: #334155; color: #e2e8f0; }

    .app { display: grid; grid-template-columns: 300px 1fr; gap: 0; height: calc(100vh - 60px); }
    @media (max-width: 800px) { .app { grid-template-columns: 1fr; height: auto; } }

    .sidebar { background: #1e293b; padding: 16px; overflow-y: auto; border-right: 1px solid #334155; }
    .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: #64748b; margin: 16px 0 8px; }
    .sidebar h2:first-child { margin-top: 0; }
    .sidebar label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 3px; }
    .sidebar input, .sidebar select { width: 100%; padding: 7px 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 13px; margin-bottom: 8px; }
    .sidebar input:focus, .sidebar select:focus { outline: none; border-color: #38bdf8; }
    .sidebar .btn { width: 100%; padding: 8px; border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
    .btn-primary { background: linear-gradient(135deg, #38bdf8, #6366f1); color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn-secondary { background: #334155; color: #e2e8f0; }
    .btn-secondary:hover { background: #475569; }
    .btn:disabled { opacity: .5; cursor: default; }

    .court-search { position: relative; }
    .court-results { position: absolute; z-index: 10; background: #1e293b; border: 1px solid #334155; border-radius: 6px; max-height: 200px; overflow-y: auto; width: 100%; display: none; }
    .court-results div { padding: 6px 10px; font-size: 12px; cursor: pointer; }
    .court-results div:hover { background: #334155; }
    .court-results .code { color: #38bdf8; font-family: monospace; margin-right: 6px; }
    .court-info { font-size: 11px; color: #64748b; margin: -4px 0 8px; min-height: 14px; }

    .main { padding: 16px; overflow-y: auto; }
    .main h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }

    .results table { width: 100%; border-collapse: collapse; font-size: 13px; background: #1e293b; border-radius: 10px; overflow: hidden; }
    .results th { text-align: left; padding: 8px 10px; background: #0f172a; color: #94a3b8; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid #334155; white-space: nowrap; }
    .results td { padding: 7px 10px; border-bottom: 1px solid #334155; vertical-align: top; }
    .results tr:hover td { background: #0f172a; }
    .results .badge { display: inline-block; padding: 1px 6px; border-radius: 4px; font-size: 10px; font-weight: 600; }
    .badge-district { background: #1e3a5f; color: #60a5fa; }
    .badge-appeal { background: #1a3a1a; color: #4ade80; }
    .badge-cassation { background: #3a2a1a; color: #fbbf24; }
    .badge-magistrate { background: #2a1a3a; color: #c084fc; }
    .empty { text-align: center; padding: 60px 20px; color: #475569; }
    .empty h3 { font-size: 18px; margin-bottom: 6px; }
    .empty p { font-size: 13px; }
    .result-count { font-size: 12px; color: #64748b; margin-bottom: 10px; }

    .detail { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100; align-items: center; justify-content: center; }
    .detail.open { display: flex; }
    .detail-card { background: #1e293b; border-radius: 12px; width: 620px; max-width: 90vw; max-height: 80vh; overflow-y: auto; padding: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
    .detail-card h2 { font-size: 16px; margin-bottom: 4px; color: #38bdf8; }
    .detail-card .case-num { font-size: 12px; color: #64748b; margin-bottom: 16px; word-break: break-all; }
    .detail-card table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .detail-card td { padding: 4px 8px; border-bottom: 1px solid #334155; }
    .detail-card td:first-child { color: #94a3b8; width: 40%; }
    .detail-card .close-btn { float: right; background: none; border: none; color: #64748b; font-size: 20px; cursor: pointer; }

    .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #38bdf8; border-top-color: transparent; border-radius: 50%; animation: spin .6s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .toast { position: fixed; bottom: 20px; right: 20px; padding: 12px 18px; border-radius: 8px; font-size: 13px; font-weight: 600; z-index: 200; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    .toast.success { background: #1a3a1a; color: #4ade80; border: 1px solid #2a5a2a; }
    .toast.error { background: #3a1a1a; color: #f87171; border: 1px solid #5a2a2a; }

    .monitor-btn { padding: 3px 10px; font-size: 11px; border: none; border-radius: 5px; cursor: pointer; background: #1e3a5f; color: #60a5fa; font-weight: 600; }
    .monitor-btn:hover { background: #2e5a8f; }
    .monitor-btn.added { background: #1a3a1a; color: #4ade80; cursor: default; }

    .tabs { display: flex; gap: 0; margin-bottom: 8px; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
    .tabs button { flex: 1; padding: 7px; border: none; background: transparent; color: #64748b; font-size: 12px; cursor: pointer; border-right: 1px solid #334155; }
    .tabs button:last-child { border-right: none; }
    .tabs button.active { background: #334155; color: #e2e8f0; font-weight: 600; }
  </style>
</head>
<body>
<header>
  <h1><span>CourtDesk</span> 🏛️</h1>
  <nav>
    <a href="/">📊 Дашборд</a>
    <a href="/search.html" style="color:#38bdf8">🔍 Поиск</a>
  </nav>
</header>
<div class="app">
  <div class="sidebar">
    <h2>🏛️ Суд</h2>
    <label>Поиск по названию</label>
    <div class="court-search" style="position:relative">
      <input id="courtSearch" placeholder="Например: индустриальный" oninput="searchCourts(this.value)" autocomplete="off">
      <div class="court-results" id="courtResults"></div>
    </div>
    <label>Код суда</label>
    <input id="courtCode" placeholder="59RS0007" onchange="loadCourtInfo(this.value)">
    <div id="courtInfo" class="court-info"></div>

    <h2>🔍 Режим</h2>
    <div class="tabs" id="modeTabs">
      <button class="active" data-mode="party" onclick="switchMode('party',this)">По участникам</button>
      <button data-mode="case" onclick="switchMode('case',this)">По номеру</button>
    </div>

    <div id="caseFields" style="display:none">
      <label>Номер дела</label>
      <input id="caseNumber" placeholder="2-1234/2026">
    </div>
    <div id="partyFields">
      <label>ФИО ответчика / название</label>
      <input id="defendant" placeholder="Фамилия или название организации">
      <label>Дата поступления с</label>
      <input type="date" id="dateFrom">
      <label>по</label>
      <input type="date" id="dateTo">
    </div>

    <button class="btn btn-primary" onclick="doSearch()" id="searchBtn">🔍 Найти</button>

    <h2>⏳ Отслеживание появления</h2>
    <label>Сторона (ФИО/название)</label>
    <input id="waitParty" placeholder="Фамилия истца/ответчика">
    <label>Дата подачи (приблизительно)</label>
    <input type="date" id="waitDate">
    <button class="btn btn-secondary" onclick="addWait()" id="waitBtn">⏳ Следить за появлением</button>
  </div>

  <div class="main">
    <div id="resultInfo" class="result-count"></div>
    <div class="results" id="resultsTable"></div>
    <div class="empty" id="emptyState">
      <h3>🔍 Поиск судебных дел</h3>
      <p>Выберите суд и режим в боковой панели, затем нажмите «Найти»</p>
    </div>
  </div>
</div>

<div class="detail" id="detailOverlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-card">
    <button class="close-btn" onclick="closeDetail()">&times;</button>
    <div id="detailContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let allResults = [];

function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function safeUrl(u) {
  const s = String(u ?? '');
  return /^https?:\/\//i.test(s) ? s : '#';
}
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || 'success');
  setTimeout(() => t.classList.remove('show'), 3000);
}
function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
}

// --- Court search ---
let courtTimer;
function searchCourts(q) {
  clearTimeout(courtTimer);
  const el = document.getElementById('courtResults');
  if (q.length < 2) { el.style.display = 'none'; return; }
  courtTimer = setTimeout(async () => {
    const r = await fetch('/api/courts?q=' + encodeURIComponent(q));
    const data = await r.json();
    const list = data.data || data || [];
    el.innerHTML = list.map(c => `<div data-code="${esc(c.code)}"><span class="code">${esc(c.code)}</span> ${esc(c.name)}</div>`).join('');
    el.style.display = list.length ? 'block' : 'none';
  }, 300);
}
document.getElementById('courtResults').addEventListener('click', e => {
  const item = e.target.closest('[data-code]');
  if (!item) return;
  document.getElementById('courtCode').value = item.dataset.code;
  document.getElementById('courtResults').style.display = 'none';
  loadCourtInfo(item.dataset.code);
});
async function loadCourtInfo(id) {
  const el = document.getElementById('courtInfo');
  try {
    const r = await fetch('/api/courts/' + encodeURIComponent(id));
    const data = await r.json();
    const c = data.data || data;
    if (!c || !c.name) { el.textContent = ''; return; }
    el.textContent = c.name + ' | регион ' + (c.region || '—');
  } catch { el.textContent = ''; }
}

// --- Mode ---
function switchMode(mode, btn) {
  document.querySelectorAll('#modeTabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('caseFields').style.display = mode === 'case' ? 'block' : 'none';
  document.getElementById('partyFields').style.display = mode === 'party' ? 'block' : 'none';
}

// --- Search ---
async function doSearch() {
  const mode = document.querySelector('#modeTabs button.active').dataset.mode;
  const courtCode = document.getElementById('courtCode').value.trim();
  if (!courtCode) { showToast('Укажите код суда', 'error'); return; }

  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Поиск…';
  document.getElementById('emptyState').style.display = 'none';

  try {
    let body, url;
    if (mode === 'case') {
      const num = document.getElementById('caseNumber').value.trim();
      if (!num) { showToast('Введите номер дела', 'error'); btn.disabled = false; btn.innerHTML = '🔍 Найти'; return; }
      body = { courtId: courtCode, caseNumber: num };
      url = '/api/search/by-number';
    } else {
      const def = document.getElementById('defendant').value.trim();
      if (!def) { showToast('Введите ФИО или название', 'error'); btn.disabled = false; btn.innerHTML = '🔍 Найти'; return; }
      const from = document.getElementById('dateFrom').value;
      const to = document.getElementById('dateTo').value;
      body = { courtId: courtCode, defendant: def, from: from || undefined, to: to || undefined };
      url = '/api/search/by-party';
    }

    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const json = await r.json();
    if (!r.ok) throw new Error(json.error || 'Ошибка поиска');

    const results = json.data?.results || [];
    const count = json.data?.count ?? results.length;
    const court = json.data?.court;
    showResults(results, count, court);
  } catch (err) {
    document.getElementById('resultsTable').innerHTML = `<div class="empty"><h3>❌ Ошибка</h3><p>${esc(err.message)}</p></div>`;
  }
  btn.disabled = false;
  btn.innerHTML = '🔍 Найти';
}

function showResults(results, count, court) {
  allResults = results;
  const info = document.getElementById('resultInfo');
  const courtLabel = court ? ` в ${esc(court.name)} (${esc(court.code)})` : '';
  info.textContent = `Найдено ${count || results.length} дел${courtLabel}`;
  renderResults();
}

function renderResults() {
  if (!allResults.length) {
    document.getElementById('resultsTable').innerHTML = '<div class="empty"><h3>Нет результатов</h3><p>Попробуйте изменить параметры поиска</p></div>';
    return;
  }
  const tbody = allResults.map((r, i) => `
    <tr data-idx="${i}" style="cursor:pointer">
      <td><b>${esc(r.caseNumber)}</b></td>
      <td><span class="badge badge-${esc(r.courtType)}">${esc(r.courtType || '?')}</span></td>
      <td>${esc(r.judge || '—')}</td>
      <td>${esc((r.result || '—').substring(0, 35))}</td>
      <td>${esc(r.legalForceDate || '—')}</td>
      <td style="white-space:nowrap">
        <button class="monitor-btn" data-idx="${i}" onclick="addToMonitor(${i});event.stopPropagation()">+📋</button>
      </td>
    </tr>`).join('');

  document.getElementById('resultsTable').innerHTML = `
    <table>
      <thead><tr><th>Номер</th><th>Тип</th><th>Судья</th><th>Результат</th><th>Вступление</th><th>Действия</th></tr></thead>
      <tbody>${tbody}</tbody>
    </table>`;
  document.getElementById('resultInfo').textContent = `Найдено ${allResults.length} дел`;
}

document.getElementById('resultsTable').addEventListener('click', e => {
  const tr = e.target.closest('tr[data-idx]');
  if (tr && !e.target.closest('.monitor-btn')) openDetail(parseInt(tr.dataset.idx));
});

// --- Add to monitoring ---
async function addToMonitor(idx) {
  const r = allResults[idx];
  if (!r) return;
  const btn = document.querySelector(`.monitor-btn[data-idx="${idx}"]`);
  if (btn && btn.classList.contains('added')) return;

  try {
    const res = await fetch('/api/cases', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        url: r.caseUrl,
        courtId: r.courtId,
        courtCode: r.courtCode || r.courtId,
        courtType: r.courtType,
        caseNumber: r.caseNumber,
      }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Ошибка');
    showToast(`Дело ${r.caseNumber} добавлено в мониторинг`, 'success');
    if (btn) { btn.textContent = '✓'; btn.classList.add('added'); }
  } catch (err) {
    showToast(err.message, 'error');
  }
}

// --- Wait (track appearance) ---
async function addWait() {
  const courtCode = document.getElementById('courtCode').value.trim();
  const party = document.getElementById('waitParty').value.trim();
  const date = document.getElementById('waitDate').value;
  if (!courtCode) { showToast('Укажите код суда', 'error'); return; }
  if (!party) { showToast('Введите сторону для отслеживания', 'error'); return; }

  const btn = document.getElementById('waitBtn');
  btn.disabled = true;
  try {
    // Determine courtType from court info
    let courtType = 'district';
    try {
      const info = await (await fetch('/api/courts/' + encodeURIComponent(courtCode))).json();
      const c = info.data || info;
      if (c && c.courtType) courtType = c.courtType;
    } catch {}

    const res = await fetch('/api/cases/wait', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ courtId: courtCode, courtType, party, filingDate: date }),
    });
    const json = await res.json();
    if (!res.ok) throw new Error(json.error || 'Ошибка');
    showToast('Отслеживание появления дела добавлено', 'success');
    document.getElementById('waitParty').value = '';
    document.getElementById('waitDate').value = '';
  } catch (err) {
    showToast(err.message, 'error');
  }
  btn.disabled = false;
}

// --- Detail ---
function openDetail(idx) {
  const r = allResults[idx];
  if (!r) return;
  const url = safeUrl(r.caseUrl);
  document.getElementById('detailContent').innerHTML = `
    <h2>${esc(r.caseNumber)}</h2>
    <div class="case-num"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:#38bdf8">${esc(url)}</a></div>
    <table>
      <tr><td>Тип суда</td><td><span class="badge badge-${esc(r.courtType)}">${esc(r.courtType || '?')}</span></td></tr>
      <tr><td>Судья</td><td>${esc(r.judge || '—')}</td></tr>
      <tr><td>Дата поступления</td><td>${esc(r.filingDate || '—')}</td></tr>
      <tr><td>Дата решения</td><td>${esc(r.decisionDate || '—')}</td></tr>
      <tr><td>Результат</td><td><strong>${esc(r.result || '—')}</strong></td></tr>
      <tr><td style="color:#4ade80;font-weight:600">Вступление в силу</td><td style="color:#4ade80;font-weight:600">${esc(r.legalForceDate || '—')}</td></tr>
    </table>
    <div style="margin-top:16px">
      <button class="btn btn-primary" style="width:auto;padding:8px 16px" onclick="addToMonitor(${idx});closeDetail()">📋 В мониторинг</button>
    </div>`;
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail() { document.getElementById('detailOverlay').classList.remove('open'); }
</script>
</body>
</html>
